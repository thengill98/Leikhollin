<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leikhöllin – Samfélagsdrifið innanhúss leiksvæði</title>
  <meta name="description" content="Leikhöllin er samfélagsdrifið innanhúss leiksvæði fyrir börn og fjölskyldur í Vestmannaeyjum." />

  <!-- Icons (Facebook/Instagram/Mail) -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      background: linear-gradient(180deg, #fff6ea, #f4f7fb);
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 40px 24px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 2.6em;
      margin: 0 0 0.3em 0;
    }

    h2 {
      margin-top: 2.2em;
      font-size: 1.6em;
    }

    p {
      font-size: 1.05em;
      margin: 0.8em 0;
    }

    .hero {
      text-align: center;
      padding-bottom: 22px;
      border-bottom: 2px dashed #ffd39a;
    }

    .hero span {
      color: #ff7a00;
      font-weight: bold;
    }

    .lang-switch {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .lang-switch button {
      background: #f1f3f5;
      border: 1px solid #e5e7eb;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95em;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .lang-switch button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.10);
    }

    .lang-switch button.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: bold;
      text-decoration: none;
      font-size: 1em;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      color: #fff;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .btn-support { background: #ff7a00; }
    .btn-mail { background: #4caf50; }
    .btn-facebook { background: #1877f2; }
    .btn-instagram { background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af); }

    /* HERO BANNER (full-width inside the card) */
    .banner {
      margin: 26px -24px 10px;
      overflow: hidden;
      position: relative;
      border-radius: 14px;
    }

    .banner img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      filter: saturate(1.05) contrast(1.02);
    }

    .banner:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.0), rgba(255,255,255,0.35));
      pointer-events: none;
    }

    @media (min-width: 768px) {
      .banner img {
        height: 320px;
      }
    }

    .card {
      background: #f9fafc;
      padding: 24px;
      border-radius: 14px;
      margin-top: 20px;
    }

    ul {
      padding-left: 20px;
      margin: 0.6em 0 0 0;
    }

    .why-grid{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1
